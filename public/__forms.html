<!--
  Static form definitions for Netlify form detection.
  Netlify scans this file at build time to register the "quote" and "contact"
  forms. The actual interactive forms live in /quote and /contact and post the
  same field names. This file is not linked from the UI.
-->
<form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="quote" />
  <input type="text" name="name" />
  <input type="text" name="businessName" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <input type="text" name="state" />
  <input type="text" name="serviceType" />
  <input type="text" name="yearsInBusiness" />
  <textarea name="message"></textarea>
  <input name="bot-field" type="text" />

                        <div style="margin-bottom: 1rem;">
                            <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Business address</label>
                            <input type="text" name="street_address" autocomplete="address-line1" style="width: 100%; padding: 0.75rem; border: 1px solid #D1D5DB; border-radius: 0.25rem; box-sizing: border-box;" required>
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">City</label>
                            <input type="text" name="city" autocomplete="address-level2" style="width: 100%; padding: 0.75rem; border: 1px solid #D1D5DB; border-radius: 0.25rem; box-sizing: border-box;" required>
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">ZIP Code</label>
                            <input type="text" name="zip" inputmode="numeric" autocomplete="postal-code" pattern="\d{5}(-\d{4})?" maxlength="10" style="width: 100%; padding: 0.75rem; border: 1px solid #D1D5DB; border-radius: 0.25rem; box-sizing: border-box;" required>
                        </div></form>

<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <input type="text" name="subject" />
  <textarea name="message"></textarea>
  <input name="bot-field" type="text" />
</form>
